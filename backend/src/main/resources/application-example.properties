# FlashReserve - example configuration template
# Copy the needed values into your local application.properties (which is NOT committed).
# NEVER put real passwords, API keys, or secrets in this file.

spring.application.name=flashreserve
# Render injects PORT at runtime; fallback keeps local dev at 8080.
server.port=${PORT:8080}
spring.config.import=optional:file:./src/main/resources/application.properties,optional:file:./backend/src/main/resources/application.properties,optional:file:./config/application.properties

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/flashreserve}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Modest pool: keeps the total across parallel Spring test contexts safely
# under the PostgreSQL default max_connections=100. Raise in production only
# with a matching PostgreSQL max_connections increase.
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# JDBC batching for multi-row inserts (event seat inventory creation).
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
# Flyway owns all schema DDL; Hibernate only validates (never modifies).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Existing populated schema must be baselined at V1 (V1 is considered already applied);
# fresh empty schema will execute V1 to create the complete schema.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jpa.open-in-view=false

# --- JWT authentication ---
# Production: when the 'production' profile is active, the
# ProductionProfileInitializer (registered in META-INF/spring.factories)
# binds jwt.secret to the JWT_SECRET environment variable with NO fallback -
# startup fails when the variable is missing/empty or matches a known
# placeholder/default value. There is no application-production.properties
# file; all production hardening lives in that initializer.
# Local development: put your own strong random secret (>= 32 characters) in
# the git-ignored application.properties or export JWT_SECRET. NEVER commit
# an actual secret to Git. Generate one, e.g.:  openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Authentication is fully stateless JWT-based; no default in-memory user needed.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# --- Reservation engine ---
# How long a temporary seat hold (PENDING booking) stays valid, e.g. 5m / 30s / 1h.
reservation.hold-duration=${RESERVATION_HOLD_DURATION:5m}
# How often the expiration job scans for due holds, e.g. 30s.
reservation.expiration-interval=${RESERVATION_EXPIRATION_INTERVAL:30s}
# Bounded wait for the per-seat distributed lock before failing with a conflict.
reservation.lock-wait-duration=${RESERVATION_LOCK_WAIT_DURATION:2s}

# --- Reservation rate limiting (distributed, per user) ---
# Protects POST /api/events/{eventId}/seats/{seatId}/reservations from request
# floods. Each authenticated user gets one bucket shared across all app
# instances: 'capacity' requests are allowed per 'refill-period'.
# Defaults below equal roughly 10 reservation attempts per user per second.
reservation.rate-limit.capacity=${RESERVATION_RATE_LIMIT_CAPACITY:10}
reservation.rate-limit.refill-period=${RESERVATION_RATE_LIMIT_REFILL_PERIOD:1s}

# --- Authentication rate limiting (distributed, per client IP) ---
# Protects the public POST /api/auth/login and POST /api/auth/register
# endpoints from request floods and brute force. Identity is the client IP
# from HttpServletRequest.getRemoteAddr(); each endpoint gets its own bucket
# shared across all app instances.
# RL-01 proxy-aware identity: direct/local deployments use the default
# (server.forward-headers-strategy NONE) so getRemoteAddr() is the TCP peer
# and spoofed X-Forwarded-For/Forwarded headers are ignored. Enable the native
# strategy below ONLY when actually behind a trusted reverse proxy; Tomcat's
# trusted-proxies list is the sole security boundary for honoring forwarding
# headers. App code never parses forwarding headers itself.
# server.forward-headers-strategy=native
# server.tomcat.remoteip.trusted-proxies=10.0.0.10,192.168.0.0/16
auth.login.capacity=${AUTH_LOGIN_RATE_LIMIT_CAPACITY:20}
auth.login.refill-period=${AUTH_LOGIN_RATE_LIMIT_REFILL_PERIOD:1m}
auth.registration.capacity=${AUTH_REGISTRATION_RATE_LIMIT_CAPACITY:10}
auth.registration.refill-period=${AUTH_REGISTRATION_RATE_LIMIT_REFILL_PERIOD:1m}

# --- Razorpay TEST MODE payments ---
# Never put real keys in this file. Keep the secrets out of Git and supply
# them via environment variables (Render dashboard or local git-ignored
# application.properties). Payment initiation fails with a controlled error
# until both are set. RAZORPAY_KEY_ID is public (may be exposed to frontend
# via API), RAZORPAY_KEY_SECRET and RAZORPAY_WEBHOOK_SECRET are backend-only.
razorpay.key-id=${RAZORPAY_KEY_ID:your_test_key_id}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:your_test_key_secret}
razorpay.currency=${RAZORPAY_CURRENCY:INR}
# Webhook verification secret from Razorpay Dashboard -> Webhooks -> Secret.
# Used to verify X-Razorpay-Signature over the raw request body. Never commit
# the real value. Provide via environment RAZORPAY_WEBHOOK_SECRET or local
# git-ignored application.properties.
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# --- Gmail OTP email (Spring Mail, Gmail App Password) ---
# Copy real values into the git-ignored application.properties only.
# The password is a Gmail App Password (https://myaccount.google.com/apppasswords),
# not the normal Gmail password. Never commit real credentials.
# Supply via environment MAIL_USERNAME / MAIL_PASSWORD (Render dashboard) or
# local git-ignored application.properties.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Registration OTP verification (short-lived, Redis-backed) ---
# ttl: how long a code stays valid (e.g. 5m); max-attempts: wrong-code tries
# before the code is invalidated; resend-cooldown: wait between sends;
# max-sends-per-hour: cap OTP emails per address per hour.
registration.otp.ttl=5m
registration.otp.max-attempts=5
registration.otp.resend-cooldown=60s
registration.otp.max-sends-per-hour=5

# --- Redis coordination (distributed reservation locking only) ---
# PostgreSQL remains the source of truth; Redis is never used to store seat state.
# Point these at your local/managed Redis. Local dev runs without password/TLS.
# Production: set REDIS_PASSWORD and REDIS_SSL_ENABLED=true for managed Redis.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# --- CORS (production-safe allow-list) ---
# Comma-separated list of allowed origins, e.g.
# CORS_ALLOWED_ORIGINS=https://app.example.com,https://admin.example.com
# Leave empty for local development (Vite proxy) — no CORS filter activated.
# Wildcard "*" is never allowed when credentials are involved.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# --- API documentation (Springdoc OpenAPI) ---
# Swagger UI:  http://localhost:8080/swagger-ui/index.html
# OpenAPI JSON: http://localhost:8080/v3/api-docs
# Public to browse; protected APIs still require a JWT when invoked.
# Production: when the 'production' profile is active,
# ProductionProfileInitializer disables both endpoints (404), so the API
# contract is not publicly discoverable. Production also binds jwt.secret to
# JWT_SECRET with no fallback (see the JWT section above).

# --- Pagination bounds (WEB-02) ---
# Pageable requests (page/size/sort) are capped at 100 items per page by
# PaginationConfig (PageableHandlerMethodArgumentResolverCustomizer) in every
# profile - development, tests and production. The default page size stays 20
# and a larger size parameter is clamped to 100 with a normal 200 response.

# --- Health visibility (Actuator) ---
# ONLY health-related endpoints are exposed. Never add env, beans, mappings,
# or configprops here - they would leak configuration and secrets.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
