# FlashReserve - example configuration template
# Copy the needed values into your local application.properties (which is NOT committed).
# NEVER put real passwords, API keys, or secrets in this file.

spring.application.name=flashreserve

spring.datasource.url=jdbc:postgresql://localhost:5432/flashreserve
spring.datasource.username=postgres
spring.datasource.password=YOUR_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# --- JWT authentication ---
# Supply a strong random secret (>= 32 characters) via environment variable in
# every real environment. NEVER commit an actual secret to Git.
# Generate one locally, e.g.:  openssl rand -base64 64
jwt.secret=${JWT_SECRET:change-me-in-local-environment-only-min-32-chars-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Authentication is fully stateless JWT-based; no default in-memory user needed.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# --- Reservation engine ---
# How long a temporary seat hold (PENDING booking) stays valid, e.g. 5m / 30s / 1h.
reservation.hold-duration=${RESERVATION_HOLD_DURATION:5m}
# How often the expiration job scans for due holds, e.g. 30s.
reservation.expiration-interval=${RESERVATION_EXPIRATION_INTERVAL:30s}
